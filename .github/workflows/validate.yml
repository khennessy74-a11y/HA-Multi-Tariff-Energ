name: Validate

on:
  push:
    branches: [develop]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: pip install ruff pytest homeassistant
      - name: Ruff
        run: ruff check custom_components
      - name: Tests
        run: pytest tests
      - name: Validate JSON
        run: |
          python -m json.tool custom_components/multi_tariff_energy/manifest.json > /dev/null
          python -m json.tool custom_components/multi_tariff_energy/strings.json > /dev/null
          python -m json.tool hacs.json > /dev/null
